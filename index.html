<style>
/* =====================================================================
   SELLER THEME  (change these to re-skin the catalogue for another seller)
   ===================================================================== */
:root{
  --bg:#0a1120;          /* page background            */
  --surface:#111b2f;     /* cards, chips, bars         */
  --surface-2:#182640;   /* image wells, raised areas  */
  --line:rgba(255,255,255,.09);
  --text:#eaf1ff;        /* main text                  */
  --muted:#9db0d1;       /* secondary text             */
  --accent:#22d3ee;      /* primary accent (electric cyan) */
  --accent-ink:#03222b;  /* text on accent             */
  --accent-2:#fbbf24;    /* prices and badges (amber)  */
  --accent-2-ink:#2a1d00;
  --glow:rgba(34,211,238,.20); /* soft header glow     */
  --wa:#25d366;          /* WhatsApp button            */
  --wa-ink:#04260f;
  --radius:16px;
}

/* ============================ BASE ================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom);
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px}

/* ============================ HERO ================================== */
.hero{
  padding:calc(18px + env(safe-area-inset-top)) 0 18px;
  background:radial-gradient(90% 130% at 100% 0%,var(--glow),transparent 62%),var(--bg);
}
.brandline{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo svg{width:16px;height:16px}
.hero h1{font-size:clamp(30px,9vw,46px);line-height:1.05;letter-spacing:-.02em;margin:12px 0 8px}
.hero h1 span{color:var(--accent)}
.tag{color:var(--muted);max-width:34em}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.slug{margin-top:14px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}

/* ============================ BUTTONS =============================== */
.btn{
  min-height:48px;padding:0 18px;border-radius:14px;border:0;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:700;text-decoration:none;
}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:scale(.98)}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.icon-btn{
  width:44px;height:44px;flex:none;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  display:grid;place-items:center;
}
.icon-btn svg{width:22px;height:22px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0}

/* ======================= CATEGORY BAR (sticky) ====================== */
.bar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;max-width:1100px;margin:0 auto}
.chips::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.chip{
  flex:none;min-height:44px;padding:0 18px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);font-weight:600;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}

/* ========================== SECTIONS ================================ */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-head h2{font-size:20px;letter-spacing:-.01em}
.hint,.count{color:var(--muted);font-size:14px}

/* ========================== COLLECTIONS ============================= */
.strip{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;
  padding:2px 12px 12px;margin:0 -12px;scrollbar-width:none;
}
.tile{
  flex:none;width:150px;aspect-ratio:3/4;position:relative;overflow:hidden;
  border-radius:var(--radius);border:1px solid var(--line);padding:0;
  background:var(--surface-2);scroll-snap-align:start;text-align:left;color:#fff;
}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,10,22,.9),rgba(4,10,22,0) 62%)}
.tile span{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;font-weight:800;line-height:1.2}
.tile small{display:block;font-weight:600;color:var(--accent);margin-top:2px}

/* ===================== MASONRY PRODUCT GRID ========================= */
.masonry{column-count:2;column-gap:10px}
@media(min-width:640px){.masonry{column-count:3;column-gap:14px}}
@media(min-width:980px){.masonry{column-count:4}}
.card{
  display:block;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
  margin:0 0 10px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;text-decoration:none;color:inherit;
  transition:transform .15s;
}
@media(min-width:640px){.card{margin-bottom:14px}}
.card:active{transform:scale(.98)}
.media{position:relative;background:var(--surface-2);overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover}
.media.nofoto{display:grid;place-items:center;text-align:center;padding:14px;color:var(--muted);font-weight:700;background:linear-gradient(135deg,var(--surface-2),var(--surface))}
.media.nofoto::after{content:attr(data-name)}
.badge{
  position:absolute;left:8px;top:8px;background:var(--accent-2);color:var(--accent-2-ink);
  font-size:11px;font-weight:800;line-height:1;padding:6px 9px;border-radius:999px;letter-spacing:.02em;
}
.meta{padding:10px 12px 12px}
.meta h3{font-size:14.5px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{color:var(--accent-2);font-weight:800}
.meta .price{margin-top:4px}
.grid-head{scroll-margin-top:64px}

/* ============================ FOOTER ================================ */
footer{margin:28px 0 0;padding:26px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer b{color:var(--text)}
footer .btn{margin-top:14px}

/* ======================== PRODUCT DETAIL ============================ */
.detail{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.detail[hidden]{display:none}
.detail.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.d-bar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bg);border-bottom:1px solid var(--line);
}
.d-title{flex:1;min-width:0;line-height:1.2}
.d-title small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.d-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-body{max-width:1000px;margin:0 auto}
.d-hero{aspect-ratio:1/1;max-height:72vh;width:100%}
.d-info{padding:16px 16px 6px}
.pill{
  min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--accent);
}
.d-info h2{font-size:26px;line-height:1.15;letter-spacing:-.01em;margin:12px 0 6px}
.d-info .price{font-size:26px}
.desc{color:var(--muted);margin-top:12px}
.block{margin-top:20px}
.label{font-size:14px;color:var(--muted);margin-bottom:8px}
.label b{color:var(--text)}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{
  min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:8px;
}
.vchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;color:var(--accent)}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:inline-block}
.specs{margin-top:8px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:12px 14px}
.specs div+div{border-top:1px solid var(--line)}
.specs dt{color:var(--muted)}
.specs dd{text-align:right;font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.related{padding:24px 12px 20px}
.related h3{font-size:20px;margin:0 4px 12px}
.d-cta{
  position:sticky;bottom:0;z-index:5;display:flex;gap:10px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--line);
}
.d-cta .btn-wa{flex:1}
@media(min-width:820px){
  .d-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:20px 16px 0;align-items:start}
  .d-media{position:sticky;top:84px}
  .d-hero{border-radius:20px;overflow:hidden;max-height:none}
  .d-info{padding:0}
  .related{padding:32px 16px 24px}
}
@media(max-width:819px){.d-media .media{border-radius:0}}

/* ============================ TOAST ================================= */
.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:200;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;
  transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* =====================================================================
   4. COLLECTIONS  (visual groupings shown as tiles on the home screen)
      Use "ids" for a hand-picked list, or "maxPrice" for a price-based one.
      "cover" is the product whose photo appears on the tile.
   ===================================================================== */
var COLLECTIONS = [
  { id:'creator', title:'Content Creator Kit', cover:'rl-creator',
    ids:['rl-creator','rl-vlog','rl-black','rl-hand','ep-black','pb-20k'] },
  { id:'charged', title:'Stay Charged', cover:'pb-20k',
    ids:['pb-20k','pb-mini','pb-pd','ch-20w','ch-wireless','ch-cable'] },
  { id:'sound', title:'Sound & Music', cover:'el-hp-pink',

  { id:'cases', title:'Case Style', cover:'case-pack',
    ids:['case-pack','case-silicone','case-leather','case-band','case-sand','case-blue'] },
  { id:'budget', title:'Under KSh 1,000', cover:'case-blue', maxPrice:1000 }
];

/* Categories that go well together (used to suggest related products) */
var COMPLEMENT = {
  powerbanks:['chargers','earphones','cases'],
  chargers:['powerbanks','cases'],
  earphones:['powerbanks','electronics','ringlights'],
  cases:['chargers','powerbanks'],
  ringlights:['earphones','powerbanks'],
  electronics:['earphones','powerbanks','chargers']
};

/* Colour dots for variant chips (matches the first word of the variant name) */
var COLORS = { black:'#111827', white:'#f5f5f5', blue:'#3b82f6', navy:'#1e3a8a', green:'#22c55e', pink:'#f472b6',
  red:'#ef4444', mint:'#6ee7b7', sand:'#d8c3a5', orange:'#fb923c', brown:'#8b5a2b', silver:'#cbd5e1', grey:'#94a3b8',
  gray:'#94a3b8', yellow:'#facc15', purple:'#a78bfa', gold:'#eab308' };

/* Card shapes cycle through these unless a product sets its own "ratio" */
var RATIOS = ['4/5','1/1','5/6','3/4','1/1','4/5','6/5'];

/* =====================================================================
   5. APP CODE  (you should not need to edit below this line)
   ===================================================================== */
var $ = function (s) { return document.querySelector(s); };
var esc = function (s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
};
function money(n) { return SELLER.currency + ' ' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

var UNSPLASH_ID = /^\d{9,}-[0-9a-f]{12}$/i;
function img(src, w) {
  return UNSPLASH_ID.test(src)
    ? 'https://images.unsplash.com/photo-' + src + '?auto=format&fit=crop&q=70&w=' + w
    : src;
}

var byId = {};
PRODUCTS.forEach(function (p, i) { p._i = i; byId[p.id] = p; });
var collById = {};
COLLECTIONS.forEach(function (c) { collById[c.id] = c; });

function catLabel(id) {
  for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i].label;
  return id;
}
function waLink(text) { return 'https://wa.me/' + SELLER.whatsapp + '?text=' + encodeURIComponent(text); }
function baseUrl() { return location.href.split('#')[0]; }

var ICON = {
  back:  '<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  share: '<svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>',
  chat:  '<svg class="i" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-12.3 7.4L3 21l2.1-5.5A8.4 8.4 0 1121 11.5z"/></svg>',
  spark: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>'
};

/* ---------- state ---------- */
var state = { cat: 'all', col: null };
var current = null, variant = null;
var BASE_TITLE = document.title;

/* ---------- pieces of UI ---------- */
function card(p, idx) {
  var ratio = p.ratio || RATIOS[p._i % RATIOS.length];
  var lazy = idx < 4 ? '' : ' loading="lazy"';
  return '<a class="card" href="#/p/' + p.id + '" data-act="open" data-id="' + p.id + '">' +
    '<div class="media" data-name="' + esc(p.name) + '" style="aspect-ratio:' + ratio + '">' +
      '<img src="' + esc(img(p.image, 480)) + '" alt="' + esc(p.name) + '"' + lazy + ' decoding="async">' +
      (p.badge ? '<span class="badge">' + esc(p.badge) + '</span>' : '') +
    '</div>' +
    '<div class="meta"><h3>' + esc(p.name) + '</h3><div class="price">' + money(p.price) + '</div></div>' +
  '</a>';
}

function collectionItems(c) {
  if (c.ids) return c.ids.map(function (id) { return byId[id]; }).filter(Boolean);
  return PRODUCTS.filter(function (p) { return p.price <= c.maxPrice; });
}

/* Mix categories so the "All" view has visual variety */
function interleave(list) {
  var groups = {}, keys = [], out = [], i = 0;
  list.forEach(function (p) {
    if (!groups[p.category]) { groups[p.category] = []; keys.push(p.category); }
    groups[p.category].push(p);
  });
  while (out.length < list.length) {
    keys.forEach(function (k) { if (groups[k][i]) out.push(groups[k][i]); });
    i++;
  }
  return out;
}

function renderChips() {
  var items = [{ id: 'all', label: 'All' }].concat(CATEGORIES);
  var bar = $('#chips');
  bar.innerHTML = items.map(function (c) {
    var on = !state.col && state.cat === c.id;
    return '<button type="button" class="chip" data-act="cat" data-cat="' + c.id + '" aria-pressed="' + on + '">' + esc(c.label) + '</button>';
  }).join('');
  var a = bar.querySelector('[aria-pressed="true"]');
  if (a && bar.scrollTo) bar.scrollTo({ left: a.offsetLeft - (bar.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' });
}

function renderCollections() {
  $('#strip').innerHTML = COLLECTIONS.map(function (c) {
    var cover = byId[c.cover] || collectionItems(c)[0];
    var n = collectionItems(c).length;
    return '<button type="button" class="tile" data-act="col" data-col="' + c.id + '" aria-label="' + esc(c.title) + ', ' + n + ' items">' +
      (cover ? '<img src="' + esc(img(cover.image, 320)) + '" alt="" loading="lazy" decoding="async">' : '') +
      '<span>' + esc(c.title) + '<small>' + n + ' items</small></span></button>';
  }).join('');
}

function renderGrid() {
  var list, title;
  if (state.col) { var c = collById[state.col]; list = collectionItems(c); title = c.title; }
  else if (state.cat === 'all') { list = interleave(PRODUCTS); title = 'Discover everything'; }
  else { list = PRODUCTS.filter(function (p) { return p.category === state.cat; }); title = catLabel(state.cat); }
  $('#gridTitle').textContent = title;
  $('#gridCount').innerHTML = list.length + ' item' + (list.length === 1 ? '' : 's') +
    (state.col ? ' &middot; <button type="button" class="link" data-act="clearcol">Show all</button>' : '');
  $('#grid').innerHTML = list.map(card).join('');
  $('#collectionsSec').hidden = !!state.col ? false : (state.cat !== 'all');
}

function setFilter(cat, col) {
  state.cat = cat || 'all';
  state.col = col || null;
  renderChips();
  renderGrid();
  var head = $('#gridHead');
  var top = head.getBoundingClientRect().top + window.pageYOffset - 64;
  if (window.pageYOffset > top) window.scrollTo(0, Math.max(top, 0));
}

/* ---------- related products ---------- */
function related(p, n) {
  n = n || 6;
  var pinned = p.related || [];
  var comp = COMPLEMENT[p.category] || [];
  var scored = PRODUCTS.filter(function (q) { return q.id !== p.id; }).map(function (q) {
    var s = pinned.indexOf(q.id) > -1 ? 10 : 0;
    if (q.category === p.category) s += 3;
    else if (comp.indexOf(q.category) > -1) s += 2;
    (q.tags || []).forEach(function (t) { if ((p.tags || []).indexOf(t) > -1) s += 1; });
    return { q: q, s: s };
  });
  scored.sort(function (a, b) { return b.s - a.s || a.q._i - b.q._i; });
  var out = [], perCat = {};
  for (var i = 0; i < scored.length && out.length < n; i++) {
    var c = scored[i].q.category;
    if ((perCat[c] || 0) >= 3) continue;    /* keep it varied */
    perCat[c] = (perCat[c] || 0) + 1;
    out.push(scored[i].q);
  }
  return out;
}

/* ---------- product detail ---------- */
function dot(v) {
  var c = COLORS[String(v).toLowerCase().split(/[\s\/]/)[0]];
  return c ? '<i class="dot" style="background:' + c + '"></i>' : '';
}

function detailHTML(p) {
  var vs = p.variants || [];
  var variantsHTML = vs.length
    ? '<div class="block"><div class="label">' + esc(p.variantLabel || 'Colour') + ': <b id="vSel">' + esc(vs[0]) + '</b></div>' +
      '<div class="vchips">' + vs.map(function (v, i) {
        return '<button type="button" class="vchip" data-act="variant" data-v="' + esc(v) + '" aria-pressed="' + (i === 0) + '">' + dot(v) + esc(v) + '</button>';
      }).join('') + '</div></div>'
    : '';
  var specsHTML = (p.specs && p.specs.length)
    ? '<div class="block"><div class="label">Specifications</div><dl class="specs">' +
      p.specs.map(function (s) { return '<div><dt>' + esc(s[0]) + '</dt><dd>' + esc(s[1]) + '</dd></div>'; }).join('') +
      '</dl></div>'
    : '';
  var rel = related(p);
  var relHTML = rel.length
    ? '<section class="related"><h3>You might also like</h3><div class="masonry">' +
      rel.map(function (q) { return card(q, 99); }).join('') + '</div></section>'
    : '';

  return '' +
  '<div class="d-bar">' +
    '<button type="button" class="icon-btn" data-act="close" aria-label="Back to catalogue">' + ICON.back + '</button>' +
    '<div class="d-title"><small>' + esc(BRAND.name) + '</small><b>' + esc(SELLER.name) + '</b></div>' +
    '<button type="button" class="icon-btn" data-act="share" aria-label="Share this product">' + ICON.share + '</button>' +
  '</div>' +
  '<div class="d-body">' +
    '<div class="d-grid">' +
      '<div class="d-media"><div class="media d-hero" data-name="' + esc(p.name) + '">' +
        '<img src="' + esc(img(p.image, 900)) + '" alt="' + esc(p.name) + '" decoding="async">' +
        (p.badge ? '<span class="badge">' + esc(p.badge) + '</span>' : '') +
      '</div></div>' +
      '<div class="d-info">' +
        '<button type="button" class="pill" data-act="cat" data-cat="' + p.category + '">' + esc(catLabel(p.category)) + ' &rsaquo;</button>' +
        '<h2>' + esc(p.name) + '</h2>' +
        '<div class="price">' + money(p.price) + '</div>' +
        '<p class="desc">' + esc(p.desc || '') + '</p>' +
        variantsHTML + specsHTML +
        '<p class="note">Sold by ' + esc(SELLER.name) + '. Availability and final price are confirmed on WhatsApp.</p>' +
      '</div>' +
    '</div>' +
    relHTML +
  '</div>' +
  '<div class="d-cta">' +
    '<button type="button" class="btn btn-ghost" data-act="share">' + ICON.share + 'Share</button>' +
    '<a class="btn btn-wa" id="dWa" target="_blank" rel="noopener" href="' + esc(waLink(SELLER.message(p, variant))) + '">' + ICON.chat + 'Enquire on WhatsApp</a>' +
  '</div>';
}

function showProduct(p) {
  var d = $('#detail');
  var wasHidden = d.hidden;
  current = p;
  variant = (p.variants && p.variants[0]) || null;
  d.innerHTML = detailHTML(p);
  if (wasHidden) {
    d.classList.add('enter');
    d.hidden = false;
    setTimeout(function () { d.classList.remove('enter'); }, 300);
  }
  d.scrollTop = 0;
  document.body.classList.add('locked');
  document.title = p.name + ' · ' + SELLER.name;
}

function hideProduct() {
  var d = $('#detail');
  if (d.hidden) return;
  d.hidden = true;
  d.innerHTML = '';
  current = null;
  document.body.classList.remove('locked');
  document.title = BASE_TITLE;
}

/* ---------- routing: #/p/<id> opens a product, anything else = catalogue ---------- */
function route() {
  var m = location.hash.match(/^#\/p\/([\w-]+)/);
  var p = m && byId[m[1]];
  if (p) showProduct(p); else hideProduct();
}

function nav(hash) {
  var i = ((history.state && history.state.i) || 0) + 1;
  try { history.pushState({ i: i }, '', hash); route(); }
  catch (e) { location.hash = hash; }   /* e.g. when opened straight from a file */
}

function toCatalogue() {
  try { history.replaceState({ i: 0 }, '', location.pathname + location.search); route(); }
  catch (e) { location.hash = ''; }
}

function closeDetail() {
  var i = history.state && history.state.i;
  if (i > 0) history.back(); else toCatalogue();
}

/* ---------- sharing ---------- */
function toast(msg) {
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
  }
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function shareProduct(p) {
  var url = baseUrl() + '#/p/' + p.id;
  var data = {
    title: p.name + ' - ' + SELLER.name,
    text: p.name + ' for ' + money(p.price) + ' at ' + SELLER.name + ' (' + BRAND.name + ')',
    url: url
  };
  function fallback() {
    copyText(data.text + '\n' + url).then(function (ok) {
      if (ok) toast('Link copied. Paste it anywhere to share.');
      else window.prompt('Copy this link to share:', url);
    });
  }
  if (navigator.share) {
    navigator.share(data).catch(function (err) { if (!err || err.name !== 'AbortError') fallback(); });
  } else fallback();
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');

  if (act === 'open') {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;   /* let "open in new tab" work */
    e.preventDefault();
    nav('#/p/' + el.getAttribute('data-id'));
  } else if (act === 'cat') {
    setFilter(el.getAttribute('data-cat'), null);
    if (current) toCatalogue();
  } else if (act === 'col') {
    setFilter('all', el.getAttribute('data-col'));
  } else if (act === 'clearcol') {
    setFilter('all', null);
  } else if (act === 'close') {
    closeDetail();
  } else if (act === 'share') {
    if (current) shareProduct(current);
  } else if (act === 'variant') {
    variant = el.getAttribute('data-v');
    var chips = document.querySelectorAll('.vchip');
    for (var i = 0; i < chips.length; i++) chips[i].setAttribute('aria-pressed', String(chips[i] === el));
    $('#vSel').textContent = variant;
    $('#dWa').href = waLink(SELLER.message(current, variant));
  } else if (act === 'surprise') {
    var pool = PRODUCTS.filter(function (p) { return !current || p.id !== current.id; });
    nav('#/p/' + pool[Math.floor(Math.random() * pool.length)].id);
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && current) closeDetail();
});

/* A photo that fails to load shows the product name instead of a broken icon */
document.addEventListener('error', function (e) {
  var t = e.target;
  if (t && t.tagName === 'IMG' && t.parentNode && t.parentNode.classList.contains('media')) {
    t.parentNode.classList.add('nofoto');
    t.parentNode.removeChild(t);
  }
}, true);

window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);

/* ---------- boot ---------- */
function boot() {
  document.title = SELLER.name + ' · ' + BRAND.name;
  BASE_TITLE = document.title;
  $('#brandName').textContent = BRAND.name;
  var first = SELLER.name.split(' ');
  $('#sellerName').innerHTML = esc(first.shift()) + ' <span>' + esc(first.join(' ')) + '</span>';
  $('#sellerTag').textContent = SELLER.tagline;
  $('#slug').textContent = BRAND.slug + '/' + SELLER.slug;
  $('#footSeller').textContent = SELLER.name;
  $('#footBrand').textContent = BRAND.name;

  var wa = $('#waTop');
  wa.href = waLink(SELLER.generalMessage);
